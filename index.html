<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业趋势量化分析 · Sector Trend Reports</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f1923;color:#c9d1d9;line-height:1.6}
.container{max-width:1000px;margin:0 auto;padding:24px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:24px;color:#f0f6fc;margin-bottom:4px}
.header .meta{color:#8b949e;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:20px;transition:border-color .15s}
.card:hover{border-color:#1f6feb}
.card h3{font-size:16px;color:#58a6ff;margin-bottom:8px}
.card .kpi{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.card .kpi-item{font-size:12px;color:#8b949e}
.card .kpi-item span{color:#f0f6fc;font-weight:600}
.label-a{color:#00d2ff}.label-b{color:#3a7bd5}.label-c{color:#f0ad4e}.label-d{color:#888}
.label-e{color:#d9534f}.label-f{color:#c9302c}.label-g{color:#a94442}.label-h{color:#5bc0de}
.empty{text-align:center;padding:60px 20px;color:#484f58}
.footer{text-align:center;padding:40px 20px;color:#484f58;font-size:12px;border-top:1px solid #21262d;margin-top:40px}
.footer a{color:#58a6ff;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📊 行业趋势量化分析</h1>
<div class="meta">Sector Trend System v1.0 · 基于申万行业指数的多周期趋势量化分析</div>
</div>
<div class="grid" id="sectorGrid">
<div class="empty">暂无分析记录。运行 sector-trend-system 分析后将自动填充。</div>
</div>
</div>
<div class="footer">
<p>Sector Trend System v1.0 · <a href="https://github.com/zhiqunlin/sector-trend-reports">GitHub 仓库</a></p>
<p style="margin-top:8px;color:#d9534f">⚠️ 不构成投资建议 · 市场有风险，投资须谨慎</p>
</div>
</body>
</html>
